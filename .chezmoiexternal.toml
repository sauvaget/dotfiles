# oh-my-zsh, cloned and pulled weekly by chezmoi (same shallow clone as a manual install).
[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"
    [".oh-my-zsh".clone]
        args = ["--depth", "1"]
    [".oh-my-zsh".pull]
        args = ["--ff-only"]
