# Packages installed by chezmoi on Arch. Draft generated from `pacman -Qqe` on rootbook (2026-09-25).
# Groups can later be switched on/off per machine (e.g. hardware, work).

packages:
  base:
    pacman:
      - base
      - base-devel
      - linux
      - linux-firmware
      - grub
      - efibootmgr
      - sudo
      - git
      - openssh
      - nano
      - zsh
      - zsh-autosuggestions
      - chezmoi
      - rbw                       # Vaultwarden CLI; also installed early by .install-password-manager.sh
      - pacman-contrib            # paccache (+ paccache.timer), checkupdates, pactree
      - networkmanager
      - networkmanager-openvpn
      - openvpn
      - iwd                       # NetworkManager's WiFi backend
      - pipewire
      - pipewire-alsa
      - pipewire-jack
      - pipewire-pulse
      - wireplumber
      - bluez
      - bluez-utils
    aur:
      - yay

  desktop:
    pacman:
      - greetd
      - greetd-tuigreet
      - swayidle
      - swaylock
      - swaybg
      - waybar
      - wofi
      - rofi
      - dunst
      - grim
      - slurp
      - wl-clipboard
      - cliphist
      - brightnessctl
      - wlsunset
      - wdisplays
      - xdg-desktop-portal-wlr
      - xorg-xwayland
      - xorg-xrdb                 # sway startup.conf merges ~/.Xresources
      - qt5-wayland
      - qt6-wayland
      - polkit-gnome              # password prompts for GUI apps; not autostarted yet
      - seahorse
      - nwg-look
      - papirus-icon-theme
      - inter-font
      - ttf-firacode-nerd
      - ttf-jetbrains-mono-nerd
      - ghostty
      - pavucontrol
      - solaar                    # Logitech devices (MX Mechanical)
      - network-manager-applet    # provides nm-connection-editor (waybar right-click)
      - thunar
      - thunar-archive-plugin
      - thunar-volman
      - gvfs
      - gvfs-mtp
      - tumbler
    aur:
      - swayfx
      - swayosd-git
      - networkmanager-dmenu-git
      - rofi-bluetooth-git

  apps:
    pacman:
      - bitwarden
      - signal-desktop
      - mattermost-desktop
      - geary
      - libreoffice-fresh
      - code
      - ausweisapp
      - hugo
      - texlive-latexrecommended
      - texlive-latexextra
      - texlive-fontsrecommended
      - texlive-fontsextra
    aur:
      - google-chrome
      - vesktop-bin
      - cheese

  cli:
    pacman:
      - neovim
      - bat
      - btop
      - fzf
      - jq
      - zoxide
      - lazygit
      - impala                    # WiFi TUI (iwd)
      - just
      - ranger
      - mc
      - less
      - man-db
      - unzip
      - wget
      - bind                      # dig, nslookup
      - nmap
      - tcpdump
      - qrencode
      - gemini-cli
      - gptfdisk
      - dosfstools
      - ddrescue
      - sleuthkit
    aur:
      - todoist-bin

  devops:
    pacman:
      - ansible
      - docker
      - kubectl
      - helm
      - k9s
      - kind
      - talosctl
      - wireguard-tools
      - npm
      - nvm
      - libvirt
      - qemu-desktop              # includes qemu-base + GTK display + virtio-gpu (test VM)
      - dnsmasq
      - nfs-utils
      - rpi-imager
    aur:
      - tilt-bin
      - rpiusbboot-git

  # Groups below are chosen automatically (see .chezmoitemplates/groups):
  #   intel / amd  from the CPU vendor, laptop  when a battery exists,
  #   rootbook     from the "Is this the rootbook" question.
  intel:
    pacman:
      - intel-ucode               # CPU microcode (embedded by the mkinitcpio microcode hook)
      - intel-media-driver
      - libva-utils
      - vulkan-intel

  amd:
    pacman:
      - amd-ucode
      - vulkan-radeon

  laptop:
    pacman:
      - sof-firmware              # sound firmware for modern Intel/AMD laptops
      - alsa-firmware
      - bolt                      # Thunderbolt / USB4
      - tlp                       # power management + battery charge limit
      - tlp-rdw
      - powertop                  # diagnostics only; its auto-tune service stays disabled

  rootbook: {}                    # ASUS, Intel Alder Lake: no extra packages, only system/rootbook/ files
                                  # (the dock's RTL8156 2.5G LAN works with the in-kernel r8152 driver)

  work:
    aur:
      - intune-portal-bin

# Deliberately NOT installed (removed from rootbook 2026-09-26). Move a line back up if you want it.
#   X11 / i3 leftovers:  arandr autorandr dmenu feh xclip xterm redshift dex
#   unused login managers (greetd is active):  lightdm lxdm xorg-xdm
#   unused on sway:      hyprshot (Hyprland tool)  awww (swaybg is used)
#   duplicates:          discord (vesktop-bin)  dhcpcd (NetworkManager does DHCP)
#   probably accidental: mattermost (the server; the client is mattermost-desktop)
#   unclear:             vulkan-radeon (AMD driver on an Intel laptop)
#                        wireguard-go-git (userspace WireGuard; kernel module + wireguard-tools suffice)
