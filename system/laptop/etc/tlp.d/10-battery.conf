# Stop charging at 80% to reduce battery wear; resume charging below 75%.
# Dell requires both values (start 50..95, at least 5 below stop); ASUS only supports
# the stop threshold and ignores the start value.
# Charge to 100% once (until next boot): sudo tlp fullcharge   (zsh alias: fullcharge)
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
