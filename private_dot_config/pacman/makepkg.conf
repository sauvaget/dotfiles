# Per-user makepkg overrides, read after /etc/makepkg.conf (used by yay for AUR builds).

# Build with all CPU cores instead of one.
MAKEFLAGS="-j$(nproc)"

# Same as the Arch default, but without "debug": don't build extra -debug packages.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
